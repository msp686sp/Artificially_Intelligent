[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rental"
version = "0.0.1"
description = "Personal zip-level rental market analysis platform (SFR cash flow, free public data)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# Needed only for the real CBSA delineation xlsx fetch. Tests use a
# bundled CSV fixture, so this is opt-in to keep the test footprint thin.
xlsx = [
    "openpyxl>=3.1",
]

[project.scripts]
rental = "rental.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rental.db" = ["*.sql"]
"rental.scoring" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

# FastAPI's idiomatic ``Depends(get_thing)`` / ``Query(...)`` /
# ``Body(...)`` defaults trip ruff's B008 ("function call in default
# argument") even though they are part of FastAPI's documented contract
# for declaring dependencies. Whitelist them so the lint stays useful
# for genuine mutability bugs.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
