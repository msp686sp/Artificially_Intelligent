# Composite MarketScore weights. Tuned against the Phase 6 backtest
# (primary target: 5yr levered cash-on-cash + appreciation, combined).

market_score:
  yield: 0.25
  demand: 0.30
  supply: 0.20
  operability: 0.20
  risk: -0.05

yield_score:
  gross_yield: 0.50               # higher is better; positive z-score
  effective_tax_rate: 0.30        # neg z (higher tax = lower score)
  insurance_rate: 0.20            # neg z (higher premium = lower score)

# Phase 2 (Demand half): wage-weighted job growth + migration + income growth.
# Within-state robust z-scores (median + MAD), weighted sum.
demand_score:
  wage_weighted_job_cagr: 0.40
  net_migration_per_1000: 0.35
  hh_income_growth: 0.25

# SupplyScore consumes Redfin-derived features (no Redfin-specific subscore).
# Weights are stubbed; final values land in Phase 3 alongside permits + vacancy.
#   dom_yoy_delta:        positive = market softening / supply pressure up
#   inventory_yoy_change: positive = more supply
supply_score:
  # redfin-agent features (weights tuned in Phase 3):
  dom_yoy_delta: null
  inventory_yoy_change: null

# OperabilityScore also borrows DOM levels (high DOM = illiquidity, an
# operator cost beyond cash flow). Final weights land in Phase 4.
#   dom_3mo_avg:          high = harder to exit (illiquidity penalty)
#   sale_to_list_3mo_avg: <1.0 = buyer's market (weaker disposition leverage)
operability_score:
  # redfin-agent features (weights tuned in Phase 4):
  dom_3mo_avg: null
  sale_to_list_3mo_avg: null

risk_score: {}
